[project]
name = "moe-anywhere"
version = "0.0.1"
description = "Run giant MoE models on the GPU you already have."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["moe_anywhere", "moe_anywhere.predictors"]
